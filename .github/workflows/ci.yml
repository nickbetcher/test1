name: CI

# Runs on every pull request and on pushes to main. Branch protection on main
# should require the jobs below to pass before a PR can merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  container:
    # Builds the production image and smoke-tests it against a real Postgres.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8000/readyz
          curl -fsS -X POST http://localhost:8000/api/v1/applications \
            -H "Authorization: Bearer dev-token-change-me" \
            -H "Content-Type: application/json" \
            -d '{"name":"smoke-test","owner_team":"CI","owner_email":"ci@example.com"}'
          curl -fsS http://localhost:8000/ | grep -q smoke-test
      - name: Logs on failure
        if: failure()
        run: docker compose logs
