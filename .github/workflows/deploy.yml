name: Build and deploy

# main    -> build image, push to GHCR, deploy to staging automatically
# v* tag  -> promote that exact image to production (gated by environment approval)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        uses: ./.github/actions/k8s-deploy
        with:
          overlay: staging
          image: ${{ needs.build.outputs.image }}
          kubeconfig: ${{ secrets.KUBECONFIG }}

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # Configure required reviewers on the "production" environment in
    # Settings -> Environments so this job waits for a human approval.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        uses: ./.github/actions/k8s-deploy
        with:
          overlay: production
          image: ${{ needs.build.outputs.image }}
          kubeconfig: ${{ secrets.KUBECONFIG }}
